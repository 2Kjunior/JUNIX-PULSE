<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" font-family="Arial, sans-serif">
  <rect width="420" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="340" height="500" rx="28" fill="#141317" stroke="#444" stroke-width="2"/>
  <rect x="20" y="130" width="340" height="390" rx="24" fill="#211F23" stroke="#3a3840"/>
  <rect x="172" y="142" width="36" height="4" rx="2" fill="#6f6b73"/>
  <text x="190" y="172" fill="#E6E1E7" font-size="16" font-weight="700" text-anchor="middle">Que voulez-vous ajouter ?</text>
  <rect x="36" y="186" width="308" height="58" rx="14" fill="#2B292D" stroke="#7C4DFF"/>
  <rect x="48" y="198" width="34" height="34" rx="10" fill="#3b2f5c"/>
  <text x="65" y="221" fill="#D0BCFF" font-size="15" text-anchor="middle">✦</text>
  <text x="92" y="210" fill="#E6E1E7" font-size="12" font-weight="700">Écrire ou dicter en une phrase</text>
  <text x="92" y="228" fill="#C9C5CA" font-size="10">Junix reconnaît rappel, tâche ou événement</text>
  <rect x="36" y="252" width="308" height="76" rx="14" fill="#2B292D" stroke="#3a3840"/>
  <rect x="48" y="266" width="34" height="34" rx="10" fill="#3b2f5c"/>
  <text x="65" y="289" fill="#D0BCFF" font-size="14" text-anchor="middle">🔔</text>
  <text x="92" y="274" fill="#E6E1E7" font-size="12" font-weight="700">Me prévenir à un moment précis</text>
  <rect x="282" y="264" width="52" height="16" rx="8" fill="#3b2f5c"/><text x="308" y="276" fill="#D0BCFF" font-size="9" font-weight="700" text-anchor="middle">Rappel</text>
  <text x="92" y="292" fill="#E6E1E7" font-size="10">Ça sonne à l’heure choisie</text>
  <text x="92" y="308" fill="#C9C5CA" font-size="10" font-style="italic">Ex : appeler maman vendredi à 18 h</text>
  <rect x="36" y="336" width="308" height="76" rx="14" fill="#2B292D" stroke="#3a3840"/>
  <rect x="48" y="350" width="34" height="34" rx="10" fill="#1f4a2d"/>
  <text x="65" y="373" fill="#6DD58C" font-size="14" text-anchor="middle">☑</text>
  <text x="92" y="358" fill="#E6E1E7" font-size="12" font-weight="700">Une chose à faire</text>
  <rect x="200" y="348" width="46" height="16" rx="8" fill="#1f4a2d"/><text x="223" y="360" fill="#6DD58C" font-size="9" font-weight="700" text-anchor="middle">Tâche</text>
  <text x="92" y="376" fill="#E6E1E7" font-size="10">Ça se coche une fois fait, avec ou sans jour</text>
  <text x="92" y="392" fill="#C9C5CA" font-size="10" font-style="italic">Ex : préparer la réunion de lundi</text>
  <rect x="36" y="420" width="308" height="76" rx="14" fill="#2B292D" stroke="#3a3840"/>
  <rect x="48" y="434" width="34" height="34" rx="10" fill="#0d3b52"/>
  <text x="65" y="457" fill="#7BD0FF" font-size="14" text-anchor="middle">▦</text>
  <text x="92" y="442" fill="#E6E1E7" font-size="12" font-weight="700">Un moment réservé</text>
  <rect x="204" y="432" width="64" height="16" rx="8" fill="#0d3b52"/><text x="236" y="444" fill="#7BD0FF" font-size="9" font-weight="700" text-anchor="middle">Événement</text>
  <text x="92" y="460" fill="#E6E1E7" font-size="10">Ça occupe l’agenda, du début à la fin</text>
  <text x="92" y="476" fill="#C9C5CA" font-size="10" font-style="italic">Ex : dentiste mardi, de 14 h à 15 h</text>
  <circle cx="378" cy="168" r="12" fill="#3DDC84" stroke="#fff" stroke-width="2"/><text x="378" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#111">1</text>
  <circle cx="378" cy="215" r="12" fill="#3DDC84" stroke="#fff" stroke-width="2"/><text x="378" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#111">2</text>
  <circle cx="378" cy="290" r="12" fill="#3DDC84" stroke="#fff" stroke-width="2"/><text x="378" y="295" font-size="12" font-weight="700" text-anchor="middle" fill="#111">3</text>
  <circle cx="378" cy="458" r="12" fill="#3DDC84" stroke="#fff" stroke-width="2"/><text x="378" y="463" font-size="12" font-weight="700" text-anchor="middle" fill="#111">4</text>
  <text x="210" y="545" fill="#333" font-size="12" text-anchor="middle">Illustration reconstituée — après (vert = ajouté)</text>
</svg>
