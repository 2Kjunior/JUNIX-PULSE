<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B3DF0"/>
      <stop offset="1" stop-color="#0AE8F0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b58bff"/>
      <stop offset="1" stop-color="#7fe9f2"/>
    </linearGradient>
    <clipPath id="orbClip"><circle cx="0" cy="0" r="62"/></clipPath>
    <!-- A1 : battement simple -->
    <g id="a1">
      <circle r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g clip-path="url(#orbClip)"><path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)" opacity="0.9"/></g>
      <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- A2 : le battement finit en crochet de J -->
    <g id="a2">
      <circle r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g clip-path="url(#orbClip)"><path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)" opacity="0.9"/></g>
      <path d="M-58 0 H-34 L-24 -30 L-10 24 L0 -6 L8 0 H28 V30 Q28 48 10 48 Q-6 48 -8 34" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="a1mono">
      <circle r="78" fill="none" stroke="#4A3780" stroke-width="12"/>
      <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#4A3780" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="a2mono">
      <circle r="78" fill="none" stroke="#4A3780" stroke-width="12"/>
      <path d="M-58 0 H-34 L-24 -30 L-10 24 L0 -6 L8 0 H28 V30 Q28 48 10 48 Q-6 48 -8 34" fill="none" stroke="#4A3780" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="a1light">
      <circle r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g clip-path="url(#orbClip)"><path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)" opacity="0.9"/></g>
      <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#4A3780" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="a2light">
      <circle r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g clip-path="url(#orbClip)"><path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)" opacity="0.9"/></g>
      <path d="M-58 0 H-34 L-24 -30 L-10 24 L0 -6 L8 0 H28 V30 Q28 48 10 48 Q-6 48 -8 34" fill="none" stroke="#4A3780" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" font-size="22" font-weight="700" text-anchor="middle" fill="#141317">Logo A · L’orbe — A1 ou A2 ?</text>

  <!-- A1 -->
  <g transform="translate(70,70)">
    <rect width="300" height="300" rx="66" fill="#141317"/>
    <g transform="translate(150,150) scale(1.15)"><use href="#a1"/></g>
    <text x="150" y="340" font-size="20" font-weight="700" text-anchor="middle" fill="#141317">A1 · Le battement</text>
    <text x="150" y="364" font-size="13" text-anchor="middle" fill="#444">L’orbe telle quelle : le nom « Junix Pulse »</text>
    <text x="150" y="382" font-size="13" text-anchor="middle" fill="#444">s’affiche sous l’icône du téléphone</text>
    <g transform="translate(55,410)">
      <rect width="56" height="56" rx="13" fill="#141317"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a1"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">petite</text>
    </g>
    <g transform="translate(125,410)">
      <rect width="56" height="56" rx="13" fill="#E9DDFF"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a1mono"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">une couleur</text>
    </g>
    <g transform="translate(195,410)">
      <rect width="56" height="56" rx="13" fill="#ffffff" stroke="#ddd"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a1light"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">fond clair</text>
    </g>
  </g>

  <!-- A2 -->
  <g transform="translate(530,70)">
    <rect width="300" height="300" rx="66" fill="#141317"/>
    <g transform="translate(150,150) scale(1.15)"><use href="#a2"/></g>
    <text x="150" y="340" font-size="20" font-weight="700" text-anchor="middle" fill="#141317">A2 · Le battement en J</text>
    <text x="150" y="364" font-size="13" text-anchor="middle" fill="#444">Le battement descend et se recourbe</text>
    <text x="150" y="382" font-size="13" text-anchor="middle" fill="#444">en crochet : le J de Junix, sans lettre ajoutée</text>
    <g transform="translate(55,410)">
      <rect width="56" height="56" rx="13" fill="#141317"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a2"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">petite</text>
    </g>
    <g transform="translate(125,410)">
      <rect width="56" height="56" rx="13" fill="#E9DDFF"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a2mono"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">une couleur</text>
    </g>
    <g transform="translate(195,410)">
      <rect width="56" height="56" rx="13" fill="#ffffff" stroke="#ddd"/>
      <g transform="translate(28,28) scale(0.22)"><use href="#a2light"/></g>
      <text x="28" y="76" font-size="10" text-anchor="middle" fill="#555">fond clair</text>
    </g>
  </g>

  <text x="450" y="590" font-size="13" text-anchor="middle" fill="#555">Illustration reconstituée : esquisses de direction, à affiner une fois la version choisie.</text>
  <text x="450" y="610" font-size="13" text-anchor="middle" fill="#555">« petite » = taille réelle d’une icône sur l’écran d’accueil ; « une couleur » = icônes à thème d’Android 13 et plus.</text>
</svg>
