<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B3DF0"/>
      <stop offset="1" stop-color="#0AE8F0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b58bff"/>
      <stop offset="1" stop-color="#7fe9f2"/>
    </linearGradient>
    <clipPath id="orbClip"><circle cx="0" cy="0" r="62"/></clipPath>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#141317">Junix Pulse — trois propositions de logo</text>
  <text x="480" y="64" font-size="13" text-anchor="middle" fill="#555">Icône d’application (fond sombre), petite taille, et version d’une seule couleur (icônes à thème d’Android)</text>

  <!-- ═══ A : L'orbe ═══ -->
  <g transform="translate(40,90)">
    <rect width="260" height="260" rx="58" fill="#141317"/>
    <g transform="translate(130,130)">
      <circle r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g clip-path="url(#orbClip)">
        <path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)" opacity="0.9"/>
      </g>
      <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="130" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#141317">A · L’orbe</text>
    <text x="130" y="322" font-size="12" text-anchor="middle" fill="#444">Le corps de Pulse (anneau + liquide)</text>
    <text x="130" y="338" font-size="12" text-anchor="middle" fill="#444">et un battement : la mascotte</text>
    <text x="130" y="354" font-size="12" text-anchor="middle" fill="#444">devient le logo</text>
    <!-- petite taille -->
    <g transform="translate(40,380)">
      <rect width="48" height="48" rx="11" fill="#141317"/>
      <g transform="translate(24,24) scale(0.185)">
        <circle r="78" fill="none" stroke="url(#g)" stroke-width="12"/>
        <g clip-path="url(#orbClip)"><path d="M-70 18 Q-50 6 -30 18 T10 18 T50 18 T90 18 V80 H-70 Z" fill="url(#liquid)"/></g>
        <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <!-- une couleur -->
    <g transform="translate(150,380)">
      <rect width="48" height="48" rx="11" fill="#E9DDFF"/>
      <g transform="translate(24,24) scale(0.185)">
        <circle r="78" fill="none" stroke="#4A3780" stroke-width="12"/>
        <path d="M-58 6 H-26 L-16 -26 L-2 34 L10 -6 L18 6 H58" fill="none" stroke="#4A3780" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- ═══ B : Le lien ═══ -->
  <g transform="translate(350,90)">
    <rect width="260" height="260" rx="58" fill="#141317"/>
    <g transform="translate(130,130)">
      <circle cx="-30" cy="0" r="52" fill="none" stroke="#8B3DF0" stroke-width="10"/>
      <circle cx="30" cy="0" r="52" fill="none" stroke="#0AE8F0" stroke-width="10"/>
      <path d="M-96 0 H-40 L-28 -30 L-10 30 L4 -16 L14 0 H96" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="130" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#141317">B · Le lien</text>
    <text x="130" y="322" font-size="12" text-anchor="middle" fill="#444">Deux cercles (toi et une personne,</text>
    <text x="130" y="338" font-size="12" text-anchor="middle" fill="#444">ou deux moments) reliés par</text>
    <text x="130" y="354" font-size="12" text-anchor="middle" fill="#444">le même battement</text>
    <g transform="translate(40,380)">
      <rect width="48" height="48" rx="11" fill="#141317"/>
      <g transform="translate(24,24) scale(0.2)">
        <circle cx="-30" r="52" fill="none" stroke="#8B3DF0" stroke-width="13"/>
        <circle cx="30" r="52" fill="none" stroke="#0AE8F0" stroke-width="13"/>
        <path d="M-96 0 H-40 L-28 -30 L-10 30 L4 -16 L14 0 H96" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g transform="translate(150,380)">
      <rect width="48" height="48" rx="11" fill="#E9DDFF"/>
      <g transform="translate(24,24) scale(0.2)">
        <circle cx="-30" r="52" fill="none" stroke="#4A3780" stroke-width="13"/>
        <circle cx="30" r="52" fill="none" stroke="#4A3780" stroke-width="13"/>
        <path d="M-96 0 H-40 L-28 -30 L-10 30 L4 -16 L14 0 H96" fill="none" stroke="#4A3780" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- ═══ C : Le cadran ═══ -->
  <g transform="translate(660,90)">
    <rect width="260" height="260" rx="58" fill="#141317"/>
    <g transform="translate(130,130)">
      <circle r="80" fill="none" stroke="url(#g)" stroke-width="10"/>
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5">
        <line x1="0" y1="-80" x2="0" y2="-66"/><line x1="80" y1="0" x2="66" y2="0"/>
        <line x1="0" y1="80" x2="0" y2="66"/><line x1="-80" y1="0" x2="-66" y2="0"/>
      </g>
      <path d="M0 0 V-46" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 0 H14 L24 -22 L36 22 L46 0 H58" fill="none" stroke="#0AE8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="9" fill="#ffffff"/>
    </g>
    <text x="130" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#141317">C · Le cadran</text>
    <text x="130" y="322" font-size="12" text-anchor="middle" fill="#444">Une horloge dont l’aiguille des</text>
    <text x="130" y="338" font-size="12" text-anchor="middle" fill="#444">minutes devient un battement :</text>
    <text x="130" y="354" font-size="12" text-anchor="middle" fill="#444">le temps qui vit</text>
    <g transform="translate(40,380)">
      <rect width="48" height="48" rx="11" fill="#141317"/>
      <g transform="translate(24,24) scale(0.19)">
        <circle r="80" fill="none" stroke="url(#g)" stroke-width="13"/>
        <path d="M0 0 V-46" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
        <path d="M0 0 H14 L24 -22 L36 22 L46 0 H58" fill="none" stroke="#0AE8F0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="11" fill="#fff"/>
      </g>
    </g>
    <g transform="translate(150,380)">
      <rect width="48" height="48" rx="11" fill="#E9DDFF"/>
      <g transform="translate(24,24) scale(0.19)">
        <circle r="80" fill="none" stroke="#4A3780" stroke-width="13"/>
        <path d="M0 0 V-46" stroke="#4A3780" stroke-width="12" stroke-linecap="round"/>
        <path d="M0 0 H14 L24 -22 L36 22 L46 0 H58" fill="none" stroke="#4A3780" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="11" fill="#4A3780"/>
      </g>
    </g>
  </g>

  <text x="480" y="580" font-size="13" text-anchor="middle" fill="#555">Illustration reconstituée : esquisses de direction, pas les fichiers finaux. Couleurs reprises de l’app (violet #8B3DF0 → cyan #0AE8F0, fond #141317).</text>
  <text x="480" y="600" font-size="13" text-anchor="middle" fill="#555">Le nom « Junix Pulse » n’est plus dans l’icône : il s’affiche déjà sous l’icône sur le téléphone.</text>
</svg>
