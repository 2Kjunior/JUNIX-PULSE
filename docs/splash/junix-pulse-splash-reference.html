<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junix Pulse – Simulation splash 4 s</title>
<style>
:root{--page:#F3F2F9;--ink:#1A1040;--muted:#6B6785;--line:#DEDBEC;--v:#8B3DF0;--c:#0AE4F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E0C1A;--ink:#F2F0FF;--muted:#A9A4C4;--line:#2a2646}}
:root[data-theme="dark"]{--page:#0E0C1A;--ink:#F2F0FF;--muted:#A9A4C4;--line:#2a2646}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.phone{width:min(100%,320px);aspect-ratio:9/16;border-radius:32px;background:#fff;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative}
.scene{position:absolute;inset:0}
.phone svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{width:min(100%,320px);height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--c))}
.t{font-size:13px;color:var(--muted);text-align:center;max-width:320px}
button{font:inherit;font-size:15px;padding:10px 22px;border-radius:999px;border:0;color:#fff;background:linear-gradient(90deg,var(--v),var(--c));cursor:pointer}


/* ===== VERRE LIQUIDE / GLASSMORPHISM ===== */
.orb{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);opacity:.85}
.o1{left:20%;top:58%;width:52%;background:radial-gradient(circle at 35% 35%,#8B3DF0 0%,rgba(139,61,240,.45) 38%,transparent 68%)}
.o2{left:80%;top:37%;width:48%;background:radial-gradient(circle at 60% 40%,#0AE8F0 0%,rgba(10,232,240,.45) 38%,transparent 68%)}
.o3{left:34%;top:30%;width:30%;background:radial-gradient(circle,rgba(139,61,240,.55),transparent 66%);opacity:.6}
.card{--sh:0 22px 50px rgba(139,61,240,.16),0 2px 0 rgba(255,255,255,.95) inset,0 -14px 30px rgba(10,232,240,.10) inset;
--sh2:0 26px 70px rgba(139,61,240,.34),0 0 56px rgba(10,232,240,.28),0 2px 0 rgba(255,255,255,.95) inset,0 -14px 30px rgba(10,232,240,.18) inset;
position:absolute;left:50%;top:48.6%;width:86.7%;height:45%;transform:translate(-50%,-50%);border-radius:12%/13%;overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.22));
-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
border:1px solid rgba(255,255,255,.8);box-shadow:var(--sh)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(255,255,255,.82)}}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 55% at 18% 0%,rgba(255,255,255,.85),transparent 58%);opacity:.7}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.8) 50%,transparent 64%);transform:translateX(-125%)}
.go .orb{animation:orbin .9s ease-out both,drift 4s ease-in-out both}
.go .o2{animation-delay:.1s,0s}.go .o3{animation-delay:.2s,0s}
.go .card{animation:liquid .95s cubic-bezier(.2,.9,.25,1) both,cbeat 1s ease-in-out 2s forwards}
.go .card::after{animation:sheen .9s ease-in-out 1.95s forwards}
@keyframes orbin{from{opacity:0}to{opacity:.85}}
@keyframes drift{from{margin:0 0 0 0}50%{margin:-2% 0 0 3%}to{margin:1% 0 0 -1%}}
@keyframes liquid{0%{opacity:0;transform:translate(-50%,-50%) scale(.45);border-radius:50%}
45%{opacity:1;transform:translate(-50%,-50%) scale(1.05,.96);border-radius:20%/16%}
75%{transform:translate(-50%,-50%) scale(.985,1.01);border-radius:13%/12%}
100%{opacity:1;transform:translate(-50%,-50%) scale(1);border-radius:12%/13%}}
@keyframes cbeat{0%{transform:translate(-50%,-50%) scale(1);box-shadow:var(--sh)}
18%{transform:translate(-50%,-50%) scale(1.03);box-shadow:var(--sh2)}
34%{transform:translate(-50%,-50%) scale(1);box-shadow:var(--sh)}
52%{transform:translate(-50%,-50%) scale(1.02);box-shadow:var(--sh2)}
100%{transform:translate(-50%,-50%) scale(1);box-shadow:var(--sh)}}
@keyframes sheen{from{transform:translateX(-125%)}to{transform:translateX(125%)}}
.scene.go{animation:out .5s ease-in 3.5s both}
.ring{stroke-dasharray:1;stroke-dashoffset:1;fill:none}
.wipe,.twipe{transform-box:view-box}
.go .sym{transform-origin:514px 447px;animation:enter 1.3s cubic-bezier(.2,.8,.2,1) .1s both}
.go .ring{animation:draw 1.25s cubic-bezier(.65,0,.25,1) .15s both}
.go .wipe{transform-origin:270px 447px;animation:sweep 1.05s cubic-bezier(.5,0,.2,1) .95s both}
.go .beat{transform-origin:514px 447px;animation:beat 1s ease-in-out 2s both}
.go .r1,.go .r2{transform-origin:514px 447px;animation:ripple 1s ease-out both}
.go .r1{animation-delay:2s}.go .r2{animation-delay:2.28s}
.go .tm{animation:rise .8s cubic-bezier(.2,.8,.2,1) 2.35s both}
.go .twipe{transform-origin:170px 760px;animation:sweep .8s cubic-bezier(.5,0,.2,1) 2.35s both}

@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes enter{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%{transform:scale(1)}18%{transform:scale(1.05)}34%{transform:scale(1)}52%{transform:scale(1.035)}70%,100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.go *,.go *::after,.scene.go{animation:none!important}.go .ring{stroke-dashoffset:0}.go .wipe,.go .twipe{transform:none}}
</style>
</head>
