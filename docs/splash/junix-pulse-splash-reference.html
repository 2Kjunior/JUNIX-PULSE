<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junix Pulse – Simulation splash 4 s</title>
<style>
:root{--page:#F3F2F9;--ink:#1A1040;--muted:#6B6785;--line:#DEDBEC;--v:#8B3DF0;--c:#0AE4F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E0C1A;--ink:#F2F0FF;--muted:#A9A4C4;--line:#2a2646}}
:root[data-theme="dark"]{--page:#0E0C1A;--ink:#F2F0FF;--muted:#A9A4C4;--line:#2a2646}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.phone{width:min(100%,320px);aspect-ratio:9/16;border-radius:32px;background:#fff;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.phone svg{width:100%;height:100%;display:block}
.bar{width:min(100%,320px);height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--c))}
.t{font-size:13px;color:var(--muted);text-align:center;max-width:320px}
button{font:inherit;font-size:15px;padding:10px 22px;border-radius:999px;border:0;color:#fff;background:linear-gradient(90deg,var(--v),var(--c));cursor:pointer}

.ring{stroke-dasharray:1;stroke-dashoffset:1;fill:none}
.wipe,.twipe{transform-box:view-box}
.go .sym{transform-origin:514px 447px;animation:enter 1.3s cubic-bezier(.2,.8,.2,1) .1s both}
.go .ring{animation:draw 1.25s cubic-bezier(.65,0,.25,1) .15s both}
.go .wipe{transform-origin:270px 447px;animation:sweep 1.05s cubic-bezier(.5,0,.2,1) .95s both}
.go .beat{transform-origin:514px 447px;animation:beat 1s ease-in-out 2s both}
.go .r1,.go .r2{transform-origin:514px 447px;animation:ripple 1s ease-out both}
.go .r1{animation-delay:2s}.go .r2{animation-delay:2.28s}
.go .tm{animation:rise .8s cubic-bezier(.2,.8,.2,1) 2.35s both}
.go .twipe{transform-origin:170px 760px;animation:sweep .8s cubic-bezier(.5,0,.2,1) 2.35s both}
.go .all{transform-origin:512px 512px;animation:out .5s ease-in 3.5s both}

@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes enter{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%{transform:scale(1)}18%{transform:scale(1.05)}34%{transform:scale(1)}52%{transform:scale(1.035)}70%,100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
